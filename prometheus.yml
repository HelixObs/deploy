global:
  scrape_interval: 15s

# Optional remote metrics forwarding (e.g. to Mimir or a shared Prometheus).
# Uncomment and set REMOTE_METRICS_URL in the environment to enable.
# remote_write:
#   - url: "${REMOTE_METRICS_URL}"
#     headers:
#       "X-Scope-OrgID": "${REMOTE_METRICS_TENANT_ID:-}"

scrape_configs:
  - job_name: herald
    static_configs:
      - targets: ["herald:2112"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: sherlock
    static_configs:
      - targets: ["sherlock:9102"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
