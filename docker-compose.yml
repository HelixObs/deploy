name: helixobs

# Bring up the full HelixObs stack:
#   docker compose up --build
#
# Production (with Caddy TLS):
#   HELIXOBS_DOMAIN=206-12-91-148.cloud.computecanada.ca \
#   UI_BASE_URL=https://206-12-91-148.cloud.computecanada.ca \
#   GRAFANA_URL=https://206-12-91-148.cloud.computecanada.ca:3001 \
#   docker compose up --build
#
# UI:          https://$HELIXOBS_DOMAIN        (or http://localhost:8081 if Caddy not running)
# Sherlock:    internal only (SSH tunnel: ssh -L 8082:localhost:8082 helixobs)
# Grafana:     https://$HELIXOBS_DOMAIN:3001   (or http://localhost:3001)
# Prometheus:  http://localhost:9091           (SSH tunnel in production)
# Herald:     $HELIXOBS_DOMAIN:4317           (gRPC+TLS in Phase 2; plaintext during Phase 1)
# TimescaleDB: localhost:5432  (helix / helix / helixobs)

volumes:
  caddy-data:
  caddy-config:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/db
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/prometheus
  loki-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/loki
  tempo-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/tempo
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/grafana

networks:
  helix:

services:

  # ── Caddy (TLS termination + reverse proxy) ───────────────────────────────────
  #
  # Phase 1 (current): Caddy handles HTTPS for UI (443) and Grafana (3001).
  #   CHIME still connects to herald:4317 and otel-collector:4319 in plaintext.
  #
  # Phase 2 (after CHIME switches OTLP endpoint to TLS):
  #   1. Uncomment the gRPC blocks in Caddyfile.
  #   2. Remove "4317:4317" from herald ports below.
  #   3. Remove "4319:4317" from otel-collector ports below.
  #   4. Add "4317:4317" and "4319:4319" to caddy ports below.
  #   5. docker compose up -d caddy herald otel-collector
  #
  # Required env vars for production:
  #   HELIXOBS_DOMAIN  — e.g. 206-12-91-148.cloud.computecanada.ca
  #   UI_BASE_URL      — e.g. https://206-12-91-148.cloud.computecanada.ca
  #   GRAFANA_URL      — e.g. https://206-12-91-148.cloud.computecanada.ca:3001
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HELIXOBS_DOMAIN: "${HELIXOBS_DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"       # ACME HTTP-01 challenge + HTTP→HTTPS redirect
      - "443:443"     # HTTPS: UI
      - "443:443/udp" # HTTP/3 (QUIC)
      - "3001:3001"   # HTTPS: Grafana (Phase 1)
      # Phase 2: enable gRPC+TLS
      # - "4317:4317"
      # - "4319:4319"
    depends_on:
      - ui
      - grafana
    networks: [helix]

  # ── TimescaleDB ───────────────────────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER:     helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB:       helixobs
      POSTGRES_INITDB_ARGS: ""
      # Keep Postgres from grabbing all available RAM
      PGDATA: /var/lib/postgresql/data/pgdata
    command: postgres -c shared_buffers=128MB -c work_mem=4MB -c max_connections=200
    volumes:
      - db-data:/var/lib/postgresql/data
      # Migrations run automatically on first container start.
      - ../herald/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ../herald/migrations/002_instrument_memory.sql:/docker-entrypoint-initdb.d/002_instrument_memory.sql:ro
      - ../herald/migrations/003_trace_dedup.sql:/docker-entrypoint-initdb.d/003_trace_dedup.sql:ro
      - ../herald/migrations/004_sherlock_usage.sql:/docker-entrypoint-initdb.d/004_sherlock_usage.sql:ro
      - ../herald/migrations/005_entity_events_trace_id.sql:/docker-entrypoint-initdb.d/005_entity_events_trace_id.sql:ro
      - ../herald/migrations/006_operation_duration.sql:/docker-entrypoint-initdb.d/006_operation_duration.sql:ro
      - ../herald/migrations/007_entity_events_error_index.sql:/docker-entrypoint-initdb.d/007_entity_events_error_index.sql:ro
      - ../herald/migrations/008_notifications.sql:/docker-entrypoint-initdb.d/008_notifications.sql:ro
      - ../herald/migrations/009_monitor_index.sql:/docker-entrypoint-initdb.d/009_monitor_index.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helixobs"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [helix]

  # ── HelixObs herald ──────────────────────────────────────────────────────────
  herald:
    image: ghcr.io/helixobs/herald:latest
    build:
      context: ../herald
    restart: unless-stopped
    environment:
      HERALD_ADDR:        ":4317"
      COLLECTOR_ENDPOINT:  "otel-collector:4317"
      DB_URL:              "postgres://helix:helix@db:5432/helixobs"
      METRICS_ADDR:        ":2112"
      API_ADDR:            ":8080"
      INSTRUMENTS_DIR:     "/instruments"
      UI_BASE_URL:         "${UI_BASE_URL:-http://localhost:8081}"
      GRAFANA_URL:         "${GRAFANA_URL:-http://localhost:3001}"
      # Instrument secrets — values come from .env or shell environment, never committed
      CHIMEFRB_SLACK_WEBHOOK:  "${CHIMEFRB_SLACK_WEBHOOK:-}"
      CHIMEFRB_GITHUB_TOKEN:   "${CHIMEFRB_GITHUB_TOKEN:-}"
    volumes:
      - ./instruments:/instruments:ro
    ports:
      - "4317:4317"   # Phase 1: plaintext gRPC; Phase 2: remove when Caddy owns TLS termination
      - "2112:2112"   # Prometheus metrics
      - "8080:8080"   # HTTP API (no security group rule — SSH tunnel only)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2112/metrics > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [helix]

  # ── OTel Collector ────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    mem_limit: 256m
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    environment:
      REMOTE_LOKI_TENANT_ID: "${REMOTE_LOKI_TENANT_ID:-}"
    volumes:
      - ./otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "4319:4317"   # Phase 1: plaintext gRPC logs; Phase 2: remove when Caddy owns TLS termination
    networks: [helix]

  # ── Tempo (trace storage) ─────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    mem_limit: 4g
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3201:3200"
      - "4318:4318"
    networks: [helix]

  # ── Loki (log storage) ────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    mem_limit: 512m
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3101:3100"
    networks: [helix]

  # ── Node Exporter (host metrics) ─────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    mem_limit: 64m
    restart: unless-stopped
    command:
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.meminfo"
      - "--collector.filesystem"
      - "--collector.diskstats"
      - "--collector.netdev"
      - "--collector.loadavg"
    networks: [helix]

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    mem_limit: 256m
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks: [helix]

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    mem_limit: 1g
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks: [helix]

  # ── Grafana Alloy (log collector) ────────────────────────────────────────────
  alloy:
    image: grafana/alloy:latest
    mem_limit: 128m
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    restart: always
    environment:
      # Set these in .env to forward sidecar logs to a remote Loki instance.
      # Defaults to local Loki when unset (harmless — Loki deduplicates exact entries).
      REMOTE_LOKI_URL:       "${REMOTE_LOKI_URL:-http://loki:3100/loki/api/v1/push}"
      REMOTE_LOKI_TENANT_ID: "${REMOTE_LOKI_TENANT_ID:-}"
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks: [helix]

  # ── Sherlock AI troubleshooting agent ────────────────────────────────────────
  sherlock:
    image: ghcr.io/helixobs/sherlock:latest
    build:
      context: ../sherlock
    restart: unless-stopped
    environment:
      SHERLOCK_INSTRUMENTS_DIR: "/app/instruments"
      ANTHROPIC_API_KEY:        "${ANTHROPIC_API_KEY}"
      HERALD_DB_URL:           "postgres://helix:helix@db:5432/helixobs"
      GITHUB_TOKEN:             "${GITHUB_TOKEN:-}"
      GRAFANA_URL:              "${GRAFANA_URL:-http://localhost:3001}"
    volumes:
      - ./instruments:/app/instruments:ro
    ports:
      - "9102:9102"   # Prometheus metrics (SSH tunnel for external access)
    networks: [helix]

  # ── HelixObs UI ──────────────────────────────────────────────────────────────
  ui:
    image: ghcr.io/helixobs/ui:latest
    build:
      context: ../ui
    restart: unless-stopped
    environment:
      HERALD_URL:  "http://herald:8080"
      SHERLOCK_URL: "http://sherlock:8082"
      GRAFANA_URL:  "${GRAFANA_URL:-http://localhost:3001}"
    depends_on:
      herald:
        condition: service_healthy
      sherlock:
        condition: service_started
    networks: [helix]

