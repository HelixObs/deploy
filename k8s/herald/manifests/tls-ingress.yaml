apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: herald-tls
  namespace: helixobs
spec:
  secretName: herald-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - herald.chimefrb.xyz
---
# IngressRouteTCP routes herald.chimefrb.xyz:443 via SNI to the herald gRPC port.
# Traefik terminates TLS and forwards plaintext h2c to herald:4317.
# Clients connect with insecure=False (standard TLS, no custom certs needed).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: herald-grpc-tls
  namespace: helixobs
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`herald.chimefrb.xyz`)
      services:
        - name: herald
          port: 4317
  tls:
    secretName: herald-tls
