auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  max_streams_per_user: 0
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  reject_old_samples: false
  # OTLP log ingestion: restrict which attributes become stream labels.
  # Mirrors the Alloy pipeline which promotes only helix_instrument_id and level.
  # helix_entity_id is intentionally excluded — one stream per entity exhausts
  # Loki's stream limit; filter by entity at query time instead.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [service.name, helix.process.name]
        - action: structured_metadata
          regex: ".*"
    log_attributes:
      - action: index_label
        attributes: [helix_instrument_id, level]
      - action: structured_metadata
        regex: ".*"

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
