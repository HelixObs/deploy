global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:2112"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: sherlock
    static_configs:
      - targets: ["sherlock:9102"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
