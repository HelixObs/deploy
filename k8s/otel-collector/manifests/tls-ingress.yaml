apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: collector-tls
  namespace: helixobs
spec:
  secretName: collector-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - collector.chimefrb.xyz
---
# IngressRouteTCP routes collector.chimefrb.xyz:443 via SNI to the OTel Collector gRPC port.
# Used for OTLP log shipping — same TLS port 443 as herald, different hostname.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: collector-grpc-tls
  namespace: helixobs
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`collector.chimefrb.xyz`)
      services:
        - name: otel-collector
          port: 4317
  tls:
    secretName: collector-tls
