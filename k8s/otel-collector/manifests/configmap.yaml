apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: helixobs
data:
  config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      transform/lowercase_level:
        log_statements:
          - context: log
            statements:
              - set(attributes["level"], ConvertCase(severity_text, "lower")) where severity_text != nil

    exporters:
      otlp_http:
        endpoint: http://tempo-distributor.tempo.svc.cluster.local:4318
        headers:
          X-Scope-OrgID: "anonymous"
      otlp_http/loki:
        endpoint: http://loki-gateway.loki.svc.cluster.local/otlp
        headers:
          X-Scope-OrgID: "anonymous"
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof: {}
      zpages: {}

    service:
      extensions: [health_check, pprof, zpages]
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlp_http, debug]
        logs:
          receivers: [otlp]
          processors: [transform/lowercase_level]
          exporters: [otlp_http/loki, debug]
