apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-scraper-config
  namespace: helixobs
data:
  config.alloy: |
    prometheus.scrape "herald" {
      targets = [{
        __address__ = "herald.helixobs.svc.cluster.local:2112",
        job         = "herald",
      }]
      scrape_interval = "15s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }

    prometheus.scrape "sherlock" {
      targets = [{
        __address__ = "sherlock.helixobs.svc.cluster.local:9102",
        job         = "sherlock",
      }]
      scrape_interval = "15s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }

    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir-gateway.mimir.svc.cluster.local/api/v1/push"
        headers = {
          "X-Scope-OrgID" = "helixobs",
        }
      }
    }
