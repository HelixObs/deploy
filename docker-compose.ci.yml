# CI override for GitHub Actions.
#
# docker-compose.yml bind-mounts volumes to /data/* (production VM paths
# that don't exist on GitHub runners). This file resets them to managed
# Docker volumes so the stack starts cleanly in CI.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

volumes:
  db-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
