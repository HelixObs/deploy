name: Acceptance Tests (T1, no Sherlock)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repos/deploy   # mirrors local layout so context: ../X resolves

    steps:
      - name: Check out deploy
        uses: actions/checkout@v4
        with:
          path: repos/deploy

      - name: Check out herald
        uses: actions/checkout@v4
        with:
          repository: HelixObs/herald
          path: repos/herald

      - name: Check out mock-telescope
        uses: actions/checkout@v4
        with:
          repository: HelixObs/mock-telescope
          path: repos/mock-telescope

      - name: Check out client-python
        uses: actions/checkout@v4
        with:
          repository: HelixObs/client-python
          path: repos/client-python

      - name: Create bind-mount directories
        run: |
          sudo mkdir -p /data/db /data/prometheus /data/loki /data/tempo /data/grafana
          # Placeholder replay file — mock-telescope falls back to random mode when empty
          # Note: working-directory is repos/deploy, so ../l1_headers.json = repos/l1_headers.json
          echo "[]" > ../l1_headers.json

      - name: Start Docker Compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.mock-telescope.yml up -d --pull always
        env:
          ANTHROPIC_API_KEY: placeholder
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for stack to be healthy
        run: |
          echo "Waiting for herald healthcheck..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:2112/metrics > /dev/null; then
              echo "Herald healthy after ${i}×5s"
              break
            fi
            echo "  attempt $i/24..."
            sleep 5
          done
          # Extra settle time for Prometheus scrape targets and Alloy log shipping
          sleep 45

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e "../client-python[dev]"
          pip install -r tests/acceptance/requirements.txt

      - name: Run acceptance tests (non-Sherlock)
        working-directory: repos/deploy/tests/acceptance
        run: pytest -v -m "not sherlock and not destructive" --tb=short
        env:
          DB_URL:         postgres://helix:helix@localhost:5432/helixobs
          HERALD_URL:    http://localhost:8080
          LOKI_URL:       http://localhost:3101
          TEMPO_URL:      http://localhost:3201
          PROMETHEUS_URL: http://localhost:9091
          OTLP_ENDPOINT:  localhost:4317

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.mock-telescope.yml logs --tail=100

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.mock-telescope.yml down -v
