receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  transform/lowercase_level:
    log_statements:
      - context: log
        statements:
          - set(attributes["level"], ConvertCase(severity_text, "lower")) where severity_text != nil

exporters:
  # ── Local stack ───────────────────────────────────────────────────────────────
  otlp_http:
    endpoint: http://tempo:4318
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

  # ── Optional remote forwarding ────────────────────────────────────────────────
  # Set REMOTE_TEMPO_ENDPOINT / REMOTE_LOKI_ENDPOINT in the environment to forward
  # signals to an additional backend (e.g. a shared observability platform).
  # When unset, both default to the local instance — harmless: Tempo and Loki are
  # idempotent for duplicate ingestion (Tempo deduplicates by trace ID; Loki rejects
  # exact-duplicate entries with 400 and does not store them twice).
  otlp_http/tempo_remote:
    endpoint: ${REMOTE_TEMPO_ENDPOINT}
  otlp_http/loki_remote:
    endpoint: ${REMOTE_LOKI_ENDPOINT}
    headers:
      "X-Scope-OrgID": "${REMOTE_LOKI_TENANT_ID}"

extensions:
  health_check: {}
  pprof: {}
  zpages: {}

service:
  extensions: [health_check, pprof, zpages]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_http, otlp_http/tempo_remote, debug]
    logs:
      receivers: [otlp]
      processors: [transform/lowercase_level]
      exporters: [otlp_http/loki, otlp_http/loki_remote]
