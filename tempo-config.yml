server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Flush head block to disk every 5 minutes (default 30m).
  # Smaller blocks = less RAM needed per compaction.
  max_block_duration: 5m
  # Cap each block at 50k traces so a single flush is bounded.
  max_block_bytes: 52428800  # 50 MiB

compactor:
  compaction:
    # Only compact 2 blocks at a time — limits peak RAM during merge.
    max_compaction_objects: 2000000
    # Keep traces for 24 hours then delete.
    block_retention: 2160h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
    # How many blocks to cache index entries for in RAM.
    cache: none
