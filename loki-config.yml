auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  max_streams_per_user: 0
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  reject_old_samples: false
  retention_period: 2160h
  bloom_gateway_enable_filtering: true
  # OTLP log ingestion: restrict which attributes become stream labels.
  # Mirrors the Alloy pipeline which promotes only helix_instrument_id and level.
  # helix_entity_id is intentionally excluded — one stream per entity exhausts
  # Loki's stream limit; filter by entity at query time instead.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [service.name, helix.process.name]
        - action: structured_metadata
          regex: ".*"
    log_attributes:
      - action: index_label
        attributes: [helix_instrument_id, helix_process_name, level, trace_id]
      - action: structured_metadata
        regex: ".*"

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Bloom filters: build a per-chunk index over structured metadata (including
# trace_id and helix_entity_id) so label-filter queries like
# | trace_id = `...` skip non-matching chunks instead of doing a full scan.
bloom_build:
  enabled: true

bloom_gateway:
  enabled: true

storage_config:
  bloom_shipper:
    working_directory: /loki/bloom

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
