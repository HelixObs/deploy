name: Acceptance Tests (Full T1 including Sherlock)

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC nightly
  workflow_dispatch:        # manual trigger

jobs:
  acceptance-full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: repos/deploy   # mirrors local layout so context: ../X resolves

    steps:
      - name: Check out deploy
        uses: actions/checkout@v4
        with:
          path: repos/deploy

      - name: Check out herald
        uses: actions/checkout@v4
        with:
          repository: HelixObs/herald
          path: repos/herald

      - name: Check out ui
        uses: actions/checkout@v4
        with:
          repository: HelixObs/ui
          path: repos/ui

      - name: Check out sherlock
        uses: actions/checkout@v4
        with:
          repository: HelixObs/sherlock
          path: repos/sherlock

      - name: Check out mock-telescope
        uses: actions/checkout@v4
        with:
          repository: HelixObs/mock-telescope
          path: repos/mock-telescope

      - name: Check out client-python
        uses: actions/checkout@v4
        with:
          repository: HelixObs/client-python
          path: repos/client-python

      - name: Start Docker Compose stack
        run: docker compose up -d --build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for stack to be healthy
        run: |
          echo "Waiting for herald healthcheck..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:2112/metrics > /dev/null; then
              echo "Herald healthy after ${i}×5s"
              break
            fi
            sleep 5
          done
          sleep 15

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e "../client-python[dev]"
          pip install -r tests/acceptance/requirements.txt

      - name: Run all T1 acceptance tests
        working-directory: repos/deploy/tests/acceptance
        run: pytest -v -m "not sherlock and not destructive" --tb=short
        env:
          DB_URL:           postgres://helix:helix@localhost:5432/helixobs
          HERALD_URL:      http://localhost:8080
          SHERLOCK_URL:     http://localhost:8082
          TEMPO_URL:        http://localhost:3201
          PROMETHEUS_URL:   http://localhost:9091
          LOKI_URL:         http://localhost:3101
          OTLP_ENDPOINT:    localhost:4317
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose down -v
