name: helixobs

# Bring up the full HelixObs stack:
#   docker compose up --build
#
# UI:          http://localhost:8081
# Sherlock:    http://localhost:8082
# Grafana:     http://localhost:3001  (admin / admin)
# Prometheus:  http://localhost:9091
# Gateway:     localhost:4317  (OTLP gRPC — point your instrument here)
# TimescaleDB: localhost:5432  (helix / helix / helixobs)

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/db
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/prometheus
  loki-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/loki
  tempo-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/tempo
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/grafana

networks:
  helix:

services:

  # ── TimescaleDB ───────────────────────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER:     helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB:       helixobs
      POSTGRES_INITDB_ARGS: ""
      # Keep Postgres from grabbing all available RAM
      PGDATA: /var/lib/postgresql/data/pgdata
    command: postgres -c shared_buffers=128MB -c work_mem=4MB -c max_connections=50
    volumes:
      - db-data:/var/lib/postgresql/data
      # Migrations run automatically on first container start.
      - ../gateway/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ../gateway/migrations/002_instrument_memory.sql:/docker-entrypoint-initdb.d/002_instrument_memory.sql:ro
      - ../gateway/migrations/003_trace_dedup.sql:/docker-entrypoint-initdb.d/003_trace_dedup.sql:ro
      - ../gateway/migrations/004_sherlock_usage.sql:/docker-entrypoint-initdb.d/004_sherlock_usage.sql:ro
      - ../gateway/migrations/005_entity_events_trace_id.sql:/docker-entrypoint-initdb.d/005_entity_events_trace_id.sql:ro
      - ../gateway/migrations/006_operation_duration.sql:/docker-entrypoint-initdb.d/006_operation_duration.sql:ro
      - ../gateway/migrations/007_entity_events_error_index.sql:/docker-entrypoint-initdb.d/007_entity_events_error_index.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helixobs"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [helix]

  # ── HelixObs gateway ──────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../gateway
    restart: unless-stopped
    environment:
      GATEWAY_ADDR:        ":4317"
      COLLECTOR_ENDPOINT:  "otel-collector:4317"
      DB_URL:              "postgres://helix:helix@db:5432/helixobs"
      METRICS_ADDR:        ":2112"
      API_ADDR:            ":8080"
    ports:
      - "4317:4317"   # OTLP gRPC — instruments connect here
      - "2112:2112"   # Prometheus metrics
      - "8080:8080"   # Graph API
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2112/metrics > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [helix]

  # ── OTel Collector ────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    mem_limit: 256m
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "4319:4317"   # OTLP gRPC for external log shipping (traces go to gateway:4317)
    networks: [helix]

  # ── Tempo (trace storage) ─────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    mem_limit: 1g
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3201:3200"
      - "4318:4318"
    networks: [helix]

  # ── Loki (log storage) ────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    mem_limit: 512m
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3101:3100"
    networks: [helix]

  # ── Node Exporter (host metrics) ─────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    mem_limit: 64m
    restart: unless-stopped
    command:
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.meminfo"
      - "--collector.filesystem"
      - "--collector.diskstats"
      - "--collector.netdev"
      - "--collector.loadavg"
    networks: [helix]

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    mem_limit: 256m
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks: [helix]

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    mem_limit: 1g
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks: [helix]

  # ── Grafana Alloy (log collector) ────────────────────────────────────────────
  alloy:
    image: grafana/alloy:latest
    mem_limit: 128m
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    restart: always
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks: [helix]

  # ── Sherlock AI troubleshooting agent ────────────────────────────────────────
  sherlock:
    build:
      context: ../sherlock
    restart: unless-stopped
    environment:
      SHERLOCK_INSTRUMENTS_DIR: "/app/instruments"
      ANTHROPIC_API_KEY:        "${ANTHROPIC_API_KEY}"
      GATEWAY_DB_URL:           "postgres://helix:helix@db:5432/helixobs"
      GITHUB_TOKEN:             "${GITHUB_TOKEN:-}"
      GRAFANA_URL:              "${PUBLIC_URL:-http://localhost}:3001"
    ports:
      - "8082:8082"
      - "9102:9102"   # Prometheus metrics
    networks: [helix]

  # ── HelixObs UI ──────────────────────────────────────────────────────────────
  ui:
    build:
      context: ../ui
    restart: unless-stopped
    environment:
      GATEWAY_URL:  "http://gateway:8080"
      SHERLOCK_URL: "http://sherlock:8082"
      GRAFANA_URL:  "${PUBLIC_URL:-http://localhost}:3001"
    ports:
      - "8081:3000"
    depends_on:
      gateway:
        condition: service_healthy
      sherlock:
        condition: service_started
    networks: [helix]

